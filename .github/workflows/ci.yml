name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and E2E smoke tests
        run: npm test
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright 5-step smoke suite
        run: npm run test:smoke
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-service
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_MOCK_INVITES: "true"

      - name: Playwright 17-AC acceptance suite
        run: npm run test:e2e:acceptance
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-service
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_MOCK_INVITES: "true"

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
          OPENAI_API_KEY: sk-test-placeholder
