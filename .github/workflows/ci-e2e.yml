name: CI E2E (Playwright)

# Heavy Chromium suites — not on every push (conserve private-repo Actions minutes).
# Run manually after substantive UI/routing changes.
on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright axe smoke (public routes — R-P2-16)
        run: npm run test:a11y
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-service
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_MOCK_INVITES: "true"

      - name: Playwright 5-step smoke suite
        run: npm run test:smoke
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-service
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_MOCK_INVITES: "true"

      - name: Playwright 17-AC acceptance suite
        run: npm run test:e2e:acceptance
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-anon
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-smoke-service
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_MOCK_INVITES: "true"
