name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Blocking gate: lint + T6 release-gate + trust coverage floors + production build.
# Repo lint targets live app code; archived imports and repo canvas artifacts are ignored.
# Playwright smoke/acceptance + axe live in ci-e2e.yml (manual) to conserve
# Actions minutes on a private repo. R-P2-16: coverage thresholds here; axe in ci-e2e.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # secrets context is not valid inside `if:` expressions; map to env first.
    env:
      T6_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.T6_SUPABASE_SERVICE_ROLE_KEY }}
      T6_SUPABASE_URL: ${{ secrets.T6_SUPABASE_URL }}
      T6_SUPABASE_ANON_KEY: ${{ secrets.T6_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (live app + docs, archives ignored)
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret

      - name: Trust-rail coverage floors (R-P2-16)
        run: npm run test:coverage
        env:
          INVITE_JWT_SECRET: ci-invite-jwt-secret

      - name: T6 release gate (PI units + unauth + security always-on)
        run: npm run test:release-gate
        env:
          T6_BASE_URL: https://www.deliverx.dev

      - name: T6 signed-in loop (optional secrets)
        if: ${{ env.T6_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run test:release-gate:live
        env:
          T6_E2E: "1"
          T6_BASE_URL: https://www.deliverx.dev
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.T6_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.T6_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.T6_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
          OPENAI_API_KEY: sk-test-placeholder
